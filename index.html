<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>X-UI — Redirecting</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  font-family:'Share Tech Mono',monospace;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;cursor:none;
}

/* CURSOR */
.cursor{position:fixed;width:10px;height:10px;background:#00ffff;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);box-shadow:0 0 10px #00ffff,0 0 30px #00ffff;}
.cursor-ring{position:fixed;width:32px;height:32px;border:1px solid rgba(0,255,255,.5);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:all .07s ease-out;}

/* AURORA BG */
.aurora{position:fixed;inset:0;background:#000;overflow:hidden;}
.al{position:absolute;border-radius:50%;filter:blur(80px);mix-blend-mode:screen;animation:af linear infinite;}
.a1{width:700px;height:700px;top:-200px;left:-200px;background:radial-gradient(circle,rgba(0,255,255,.4),transparent 70%);animation-duration:12s;}
.a2{width:600px;height:600px;top:10%;right:-150px;background:radial-gradient(circle,rgba(180,0,255,.4),transparent 70%);animation-duration:15s;animation-delay:-5s;}
.a3{width:500px;height:500px;bottom:-100px;left:30%;background:radial-gradient(circle,rgba(255,0,128,.35),transparent 70%);animation-duration:10s;animation-delay:-3s;}
.a4{width:400px;height:400px;top:40%;left:10%;background:radial-gradient(circle,rgba(0,255,128,.25),transparent 70%);animation-duration:18s;animation-delay:-8s;}
.a5{width:350px;height:350px;top:20%;right:20%;background:radial-gradient(circle,rgba(255,200,0,.2),transparent 70%);animation-duration:14s;animation-delay:-2s;}
@keyframes af{0%{transform:translate(0,0) scale(1);}25%{transform:translate(60px,-40px) scale(1.1);}50%{transform:translate(-40px,60px) scale(.9);}75%{transform:translate(80px,30px) scale(1.05);}100%{transform:translate(0,0) scale(1);}}

/* GRID */
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,255,.06) 1px,transparent 1px);background-size:50px 50px;animation:gm 4s linear infinite;}
@keyframes gm{0%{background-position:0 0;}100%{background-position:0 50px;}}

/* RAIN CANVAS */
canvas#rain{position:fixed;inset:0;opacity:.15;pointer-events:none;}

/* SCANLINES */
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.1) 2px,rgba(0,0,0,.1) 4px);}

/* MOVING SCANBAR */
.scanbar{position:fixed;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00ffff,#bf00ff,#ff007f,transparent);animation:sb 2.5s linear infinite;pointer-events:none;z-index:6;opacity:.8;box-shadow:0 0 12px #00ffff,0 0 30px #bf00ff;}
@keyframes sb{0%{top:0;}100%{top:100vh;}}

/* CORNER DECO */
.corner{position:fixed;width:60px;height:60px;pointer-events:none;}
.corner::before,.corner::after{content:'';position:absolute;}
.corner::before{width:2px;height:100%;background:linear-gradient(180deg,#00ffff,#bf00ff);animation:cg 2s ease-in-out infinite;}
.corner::after{width:100%;height:2px;background:linear-gradient(90deg,#00ffff,#bf00ff);animation:cg 2s ease-in-out infinite alternate;}
@keyframes cg{0%,100%{opacity:.4;box-shadow:none;}50%{opacity:1;box-shadow:0 0 10px #00ffff;}}
.corner.tl{top:16px;left:16px;}.corner.tr{top:16px;right:16px;transform:scaleX(-1);}.corner.bl{bottom:16px;left:16px;transform:scaleY(-1);}.corner.br{bottom:16px;right:16px;transform:scale(-1);}

/* HEX FLOATERS */
.hexes{position:fixed;inset:0;pointer-events:none;}
.hex{position:absolute;opacity:0;animation:hf linear infinite;font-family:'Orbitron',sans-serif;font-size:10px;}
@keyframes hf{0%{transform:translateY(110vh) rotate(0deg);opacity:0;}5%{opacity:1;}95%{opacity:.5;}100%{transform:translateY(-20vh) rotate(360deg);opacity:0;}}

/* CARD */
.card{position:relative;z-index:10;width:min(540px,92vw);animation:ca .9s cubic-bezier(.16,1,.3,1) both;}
@keyframes ca{from{opacity:0;transform:scale(.85) translateY(40px);}to{opacity:1;transform:scale(1) translateY(0);}}

.card-inner{
  background:rgba(4,7,18,.85);backdrop-filter:blur(24px);
  border:1px solid rgba(0,255,255,.15);
  clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));
  padding:36px 40px 32px;position:relative;overflow:hidden;
}

/* Rainbow border */
.card-inner::before{
  content:'';position:absolute;inset:-2px;z-index:-1;
  background:linear-gradient(135deg,#00ffff,#bf00ff,#ff007f,#ffaa00,#00ff88,#00ffff);
  background-size:400% 400%;
  clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));
  animation:rb 4s linear infinite;opacity:.65;
}
@keyframes rb{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

/* Inner shimmer */
.card-inner::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(0,255,255,.05),transparent 50%,rgba(191,0,255,.05));animation:is 4s ease-in-out infinite;}
@keyframes is{0%,100%{opacity:.5;}50%{opacity:1;}}

/* Cut corner */
.cut-corner{position:absolute;top:0;right:0;width:28px;height:28px;background:linear-gradient(135deg,transparent 50%,rgba(0,255,255,.4) 50%);}

/* TOP BAR */
.topbar{display:flex;align-items:center;gap:6px;margin-bottom:26px;padding-bottom:16px;border-bottom:1px solid rgba(0,255,255,.1);}
.tb-dot{width:10px;height:10px;border-radius:50%;}
.tb-dot:nth-child(1){background:#ff5f57;box-shadow:0 0 8px #ff5f57;}
.tb-dot:nth-child(2){background:#febc2e;box-shadow:0 0 8px #febc2e;}
.tb-dot:nth-child(3){background:#28c840;box-shadow:0 0 8px #28c840;}
.tb-title{margin-left:auto;margin-right:auto;font-size:10px;letter-spacing:3px;color:rgba(0,255,255,.45);}

/* LOGO ROW */
.logo-row{display:flex;align-items:center;gap:18px;margin-bottom:26px;}
.logo-hex{position:relative;width:64px;height:64px;flex-shrink:0;}
.logo-hex svg{width:100%;height:100%;animation:lh 4s ease-in-out infinite;}
@keyframes lh{0%,100%{filter:drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 25px #bf00ff);}33%{filter:drop-shadow(0 0 18px #ff007f) drop-shadow(0 0 35px #ff007f);}66%{filter:drop-shadow(0 0 18px #00ff88) drop-shadow(0 0 35px #00ff88);}}
.logo-letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px;background:linear-gradient(135deg,#00ffff,#bf00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.brand-name{font-family:'Orbitron',sans-serif;font-weight:900;font-size:30px;letter-spacing:6px;background:linear-gradient(90deg,#00ffff,#bf00ff,#ff007f,#ffaa00,#00ff88,#00ffff);background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:tn 3s linear infinite,glitch 8s infinite;}
@keyframes tn{0%{background-position:0%;}100%{background-position:300%;}}
@keyframes glitch{0%,100%{clip-path:none;transform:none;}91%{clip-path:none;transform:none;}92%{clip-path:polygon(0 15%,100% 15%,100% 28%,0 28%);transform:translateX(-4px);}93%{clip-path:polygon(0 55%,100% 55%,100% 68%,0 68%);transform:translateX(4px);}94%{clip-path:none;transform:none;}}
.brand-sub{font-size:9px;letter-spacing:4px;color:rgba(0,255,255,.4);margin-top:4px;}
.version-tag{margin-left:auto;background:linear-gradient(135deg,rgba(0,255,255,.12),rgba(191,0,255,.12));border:1px solid rgba(0,255,255,.3);color:#00ffff;font-size:9px;letter-spacing:2px;padding:4px 12px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);animation:vt 2s ease-in-out infinite;}
@keyframes vt{0%,100%{box-shadow:none;}50%{box-shadow:0 0 20px rgba(0,255,255,.5);}}

/* STATUS ROW */
.status-row{display:flex;gap:12px;margin-bottom:22px;}
.stat{flex:1;background:rgba(0,255,255,.04);border:1px solid rgba(0,255,255,.1);padding:10px 12px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);}
.stat-lbl{font-size:8px;letter-spacing:2px;color:rgba(0,255,255,.35);margin-bottom:4px;}
.stat-val{font-size:12px;letter-spacing:1px;color:#00ffff;}
.stat-val.g{color:#00ff88;}.stat-val.p{color:#bf00ff;}
.odot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#00ff88;box-shadow:0 0 8px #00ff88;animation:bl 1s ease-in-out infinite;margin-right:5px;}
@keyframes bl{0%,100%{opacity:1;}50%{opacity:.15;}}

/* REDIRECT TITLE */
.rtitle{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:4px;background:linear-gradient(90deg,#00ffff,#bf00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
.rmsg{font-size:11px;color:rgba(180,200,255,.5);letter-spacing:1px;line-height:1.9;margin-bottom:20px;}

/* URL BOX */
.url-lbl{font-size:8px;letter-spacing:3px;color:rgba(0,255,255,.35);margin-bottom:6px;}
.url-box{background:rgba(0,0,0,.5);border-left:3px solid transparent;border-image:linear-gradient(180deg,#00ffff,#bf00ff) 1;padding:12px 16px;font-size:11px;color:#00ffff;letter-spacing:1px;margin-bottom:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;}
.url-box::after{content:'';position:absolute;right:0;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(4,7,18,.95));}

/* PROGRESS */
.ph{display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;color:rgba(0,255,255,.4);margin-bottom:8px;}
.pt{height:6px;background:rgba(255,255,255,.05);clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);overflow:hidden;position:relative;margin-bottom:6px;}
.pf{height:100%;width:0%;background:linear-gradient(90deg,#7b00ff,#00ffff,#00ff88);background-size:200%;animation:ps 1.5s linear infinite;transition:width .4s ease;position:relative;}
.pf::after{content:'';position:absolute;right:-2px;top:-4px;bottom:-4px;width:4px;background:#fff;box-shadow:0 0 12px #00ffff,0 0 30px #00ffff;border-radius:2px;}
@keyframes ps{0%{background-position:0%;}100%{background-position:200%;}}
.pm{display:flex;justify-content:space-between;margin-bottom:20px;}
.mk{width:1px;height:4px;background:rgba(0,255,255,.15);}
.mk.on{background:#00ffff;box-shadow:0 0 4px #00ffff;}

/* BOTTOM ROW */
.bot{display:flex;align-items:center;gap:18px;}
.count-wrap{position:relative;flex-shrink:0;}
.rsvg{width:80px;height:80px;}
.rb-bg{fill:none;stroke:rgba(0,255,255,.1);stroke-width:4;}
.rb-prog{fill:none;stroke-width:4;stroke-linecap:round;stroke:url(#rg);stroke-dasharray:201;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .9s ease;filter:drop-shadow(0 0 6px #00ffff);}
.cnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:24px;background:linear-gradient(135deg,#00ffff,#bf00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.cunit{font-size:7px;letter-spacing:2px;color:rgba(0,255,255,.35);margin-top:2px;}
.btns{display:flex;flex-direction:column;gap:10px;flex:1;}
.btn{width:100%;padding:12px 0;font-family:'Orbitron',sans-serif;font-weight:700;font-size:10px;letter-spacing:3px;cursor:pointer;border:none;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:all .2s;position:relative;overflow:hidden;}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:translateX(-100%);transition:transform .4s;}
.btn:hover::before{transform:translateX(100%);}
.btn-go{background:linear-gradient(90deg,#00ffff,#bf00ff,#ff007f,#ffaa00,#00ff88);background-size:300%;color:#000;animation:btnr 2s linear infinite;box-shadow:0 0 20px rgba(0,255,255,.4),0 0 40px rgba(191,0,255,.2);}
.btn-go:hover{box-shadow:0 0 35px rgba(0,255,255,.8),0 0 60px rgba(191,0,255,.5);transform:translateY(-2px);}
@keyframes btnr{0%{background-position:0%;}100%{background-position:300%;}}
.btn-cancel{background:transparent;border:1px solid rgba(255,60,100,.4);color:rgba(255,60,100,.7);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;}
.btn-cancel:hover{background:rgba(255,60,100,.1);border-color:rgba(255,60,100,.8);color:#ff3c64;box-shadow:0 0 20px rgba(255,60,100,.3);}

/* FOOTER */
.footer{margin-top:22px;padding-top:14px;border-top:1px solid rgba(0,255,255,.08);display:flex;justify-content:space-between;font-size:8px;letter-spacing:1px;color:rgba(0,255,255,.2);}

/* FLASH */
#flash{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#00ffff,#bf00ff,#ff007f);opacity:0;pointer-events:none;transition:opacity .3s;}

/* SPARK TRAIL */
.spark{position:fixed;pointer-events:none;z-index:99997;border-radius:50%;animation:spk .6s ease-out forwards;}
@keyframes spk{0%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(0) translateY(-20px);}}
</style>
</head>
<body>

<div id="flash"></div>
<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="curRing"></div>

<div class="aurora">
  <div class="al a1"></div><div class="al a2"></div>
  <div class="al a3"></div><div class="al a4"></div><div class="al a5"></div>
</div>
<div class="grid"></div>
<canvas id="rain"></canvas>
<div class="scanlines"></div>
<div class="scanbar"></div>
<div class="hexes" id="hexes"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div class="card">
<div class="card-inner">
<div class="cut-corner"></div>

<!-- Top bar -->
<div class="topbar">
  <div class="tb-dot"></div><div class="tb-dot"></div><div class="tb-dot"></div>
  <div class="tb-title">X-UI SECURE REDIRECT</div>
</div>

<!-- Logo -->
<div class="logo-row">
  <div class="logo-hex">
    <svg viewBox="0 0 64 64">
      <defs>
        <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00ffff"/><stop offset="50%" stop-color="#bf00ff"/><stop offset="100%" stop-color="#ff007f"/>
        </linearGradient>
        <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00ffff"/><stop offset="100%" stop-color="#bf00ff"/>
        </linearGradient>
      </defs>
      <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="none" stroke="url(#hg)" stroke-width="2" opacity=".6"/>
      <polygon points="32,12 50,23 50,41 32,52 14,41 14,23" fill="rgba(0,255,255,.04)" stroke="url(#hg)" stroke-width="1" opacity=".4"/>
    </svg>
    <div class="logo-letter">X</div>
  </div>
  <div>
    <div class="brand-name">X-UI</div>
    <div class="brand-sub">MANAGEMENT PANEL</div>
  </div>
  <div class="version-tag">v2.4.1</div>
</div>

<!-- Status -->
<div class="status-row">
  <div class="stat"><div class="stat-lbl">STATUS</div><div class="stat-val g"><span class="odot"></span>ONLINE</div></div>
  <div class="stat"><div class="stat-lbl">SESSION</div><div class="stat-val" id="sid">--</div></div>
  <div class="stat"><div class="stat-lbl">PING</div><div class="stat-val p" id="ping">--ms</div></div>
</div>

<!-- Message -->
<div class="rtitle">// REDIRECT INITIATED</div>
<div class="rmsg" id="rmsg">Đang thiết lập kết nối bảo mật...<br/>Hệ thống sẽ tự động chuyển hướng.</div>

<!-- URL -->
<div class="url-lbl">▶ TARGET ENDPOINT</div>
<div class="url-box" id="urlBox">https://your-server.com:54321/</div>

<!-- Progress -->
<div class="ph"><span>ESTABLISHING TUNNEL</span><span id="pct">0%</span></div>
<div class="pt"><div class="pf" id="pf"></div></div>
<div class="pm" id="marks"></div>

<!-- Bottom -->
<div class="bot">
  <div class="count-wrap">
    <svg class="rsvg" viewBox="0 0 70 70">
      <defs>
        <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00ffff"/><stop offset="100%" stop-color="#bf00ff"/>
        </linearGradient>
      </defs>
      <circle class="rb-bg" cx="35" cy="35" r="32"/>
      <circle class="rb-prog" id="rp" cx="35" cy="35" r="32"/>
    </svg>
    <div class="cnum"><span id="cnum">05</span><span class="cunit">GIÂY</span></div>
  </div>
  <div class="btns">
    <button class="btn btn-go" onclick="goNow()">▶▶ ĐI NGAY</button>
    <button class="btn btn-cancel" onclick="cancelRedirect()">✕ HỦY CHUYỂN HƯỚNG</button>
  </div>
</div>

<div class="footer">
  <span>X-UI REDIRECT ENGINE © 2024</span>
  <span id="ts">--</span>
</div>
</div>
</div>

<script>
// ══════════════════════════════════════════
//  ⚙️  ĐỔI URL TẠI ĐÂY
const TARGET_URL    = 'https://thuylinhyuz.online';
const DELAY_SECONDS = 5;
// ══════════════════════════════════════════

// Cursor
const cur=document.getElementById('cur'), ring=document.getElementById('curRing');
document.addEventListener('mousemove',e=>{
  cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px';
  setTimeout(()=>{ ring.style.left=e.clientX+'px'; ring.style.top=e.clientY+'px'; },70);
});

// Spark trail on click
document.addEventListener('click', e => {
  const colors=['#00ffff','#bf00ff','#ff007f','#ffaa00','#00ff88'];
  for(let i=0;i<8;i++){
    const s=document.createElement('div');
    s.className='spark';
    const sz=4+Math.random()*8;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX}px;top:${e.clientY}px;background:${colors[Math.floor(Math.random()*colors.length)]};box-shadow:0 0 6px currentColor;animation-delay:${Math.random()*.2}s;`;
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),700);
  }
});

// Init
document.getElementById('sid').textContent = Math.random().toString(36).substr(2,8).toUpperCase();
document.getElementById('ping').textContent = (8+Math.floor(Math.random()*40))+'ms';
const now=new Date(); document.getElementById('ts').textContent=now.toISOString().replace('T',' ').substr(0,19)+' UTC';
document.getElementById('urlBox').textContent = TARGET_URL;


// Matrix rain
const canvas=document.getElementById('rain'), ctx=canvas.getContext('2d');
function rc(){ canvas.width=innerWidth; canvas.height=innerHeight; }
rc(); window.addEventListener('resize',rc);
const cols=Math.floor(innerWidth/18), drops=Array(cols).fill(1);
const chars='01アイウエオXUIabcdef#$%&@!◈⬡▸';
function rain(){
  ctx.fillStyle='rgba(0,0,0,.06)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  drops.forEach((y,i)=>{
    const ch=chars[Math.floor(Math.random()*chars.length)];
    const h=Math.random()>.8?300:180;
    ctx.fillStyle=`hsla(${h},100%,70%,.8)`;
    ctx.font='13px Share Tech Mono'; ctx.fillText(ch,i*18,y*18);
    if(y*18>canvas.height&&Math.random()>.975) drops[i]=0;
    drops[i]++;
  });
}
setInterval(rain,50);

// Hex floaters
const hxc=document.getElementById('hexes');
const hxch=['⬡','⬢','◈','◇','▸','■','✦','⊕','⊗','※'];
for(let i=0;i<25;i++){
  const el=document.createElement('div'); el.className='hex';
  el.textContent=hxch[Math.floor(Math.random()*hxch.length)];
  el.style.left=Math.random()*100+'vw';
  el.style.animationDuration=(10+Math.random()*20)+'s';
  el.style.animationDelay=(-Math.random()*20)+'s';
  el.style.fontSize=(8+Math.random()*18)+'px';
  const h=[180,270,330,120,40][Math.floor(Math.random()*5)];
  el.style.color=`hsla(${h},100%,70%,.4)`; hxc.appendChild(el);
}

// Progress marks
const mks=document.getElementById('marks');
for(let i=0;i<20;i++){ const m=document.createElement('div'); m.className='mk'; mks.appendChild(m); }

// Ring setup
const C=2*Math.PI*32; const rp=document.getElementById('rp');
rp.style.strokeDasharray=C; rp.style.strokeDashoffset=0;

// Countdown
let rem=DELAY_SECONDS, cancelled=false;
function upd(){
  const el=DELAY_SECONDS-rem, ratio=el/DELAY_SECONDS, pct=Math.round(ratio*100);
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pct').textContent=pct+'%';
  rp.style.strokeDashoffset=C*(1-ratio);
  document.querySelectorAll('.mk').forEach((m,i)=>m.classList.toggle('on',i<Math.floor(ratio*20)));
}

const ticker=setInterval(()=>{
  if(cancelled)return;
  rem--; document.getElementById('cnum').textContent=String(Math.max(0,rem)).padStart(2,'0');
  upd(); if(rem<=0){ clearInterval(ticker); goNow(); }
},1000);

function goNow(){
  if(cancelled)return; clearInterval(ticker);
  document.getElementById('pf').style.width='100%';
  document.getElementById('pct').textContent='100%';
  document.getElementById('cnum').textContent='00';
  rp.style.strokeDashoffset=0;
  const fl=document.getElementById('flash'); fl.style.opacity='.3';
  setTimeout(()=>{ window.location.href=TARGET_URL; },450);
}

function cancelRedirect(){
  cancelled=true; clearInterval(ticker);
  const n=document.getElementById('cnum');
  n.textContent='✕'; n.style.fontSize='20px';
  document.querySelector('.rtitle').textContent='// REDIRECT CANCELLED';
  document.getElementById('rmsg').innerHTML='Đã hủy bởi người dùng.<br/>Nhấn "ĐI NGAY" để chuyển hướng thủ công.';
}
</script>
